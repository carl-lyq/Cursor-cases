# 扫描器会优先使用此处内容，覆盖自动推断。

project: 押题班画像
domain: 数据分析 / 运营
one_liner: 把 Excel 学生表变成可交互画像看板，辅助开班决策

background: |
  押题班运营需要快速看清学员结构、目标分分布、躺着学 vs 非躺着学差异。
  以往每次开班前都要人工做表，口径还容易不一致。

traditional:
  workflow: 运营用 Excel 透视 + 手工图表，改维度要重做
  pain: 迭代慢、口径难统一、不便汇报演示
  baseline: 约 2–3 天一版

with_cursor:
  tools:
    - Cursor Agent
    - PRD 驱动开发
    - Python 脚本生成看板
  workflow: |
    先写 PRD 定统计口径 → 用自然语言让 Agent 写提取脚本和 HTML 看板 →
    按需改 Tab/筛选，当天可出可演示版本。

impact:
  time_ratio: 首版约 1 天内可演示
  quality: 口径与 PRD 一致，可交互筛选
  enabled: 非技术同事也能用对话改统计维度

status: active
